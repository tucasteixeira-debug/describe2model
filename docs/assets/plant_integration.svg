<svg viewBox="0 0 820 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .step { fill: #eef2ff; stroke: #33449a; stroke-width: 1.4; rx: 7; }
    .plant { fill: #fff2e8; stroke: #a85b1f; stroke-width: 1.4; rx: 7; }
    .code { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; fill: #111; }
    .sub { font-size: 11px; fill: #444; }
    .edge { stroke: #666; stroke-width: 1.4; fill: none; marker-end: url(#arrow3); }
  </style>

  <text x="410" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#111">One scan, with a physics plant attached (Elevator_System_2/3)</text>

  <rect class="step" x="20" y="55" width="190" height="60"/>
  <text class="code" x="115" y="80" text-anchor="middle">run_scan(tags)</text>
  <text class="sub" x="115" y="100" text-anchor="middle">reads Current_Floor,</text>
  <text class="sub" x="115" y="113" text-anchor="middle">writes fresh Moving</text>

  <path class="edge" d="M 210 85 L 300 85"/>

  <rect class="plant" x="310" y="55" width="190" height="60"/>
  <text class="code" x="405" y="80" text-anchor="middle">plant.step(tags)</text>
  <text class="sub" x="405" y="100" text-anchor="middle">reads THIS scan's Moving,</text>
  <text class="sub" x="405" y="113" text-anchor="middle">writes next Current_Floor</text>

  <path class="edge" d="M 500 85 C 560 85, 560 170, 500 170"/>
  <text x="530" y="130" class="sub">next</text>
  <text x="530" y="143" class="sub">scan</text>

  <rect class="step" x="310" y="150" width="190" height="60"/>
  <text class="code" x="405" y="175" text-anchor="middle">run_scan(tags)</text>
  <text class="sub" x="405" y="195" text-anchor="middle">reads the Current_Floor</text>
  <text class="sub" x="405" y="208" text-anchor="middle">the plant just wrote</text>

  <path class="edge" d="M 310 180 L 220 180"/>

  <rect x="20" y="150" width="190" height="60" fill="none" stroke="#999" stroke-dasharray="4 3" rx="6"/>
  <text class="sub" x="115" y="175" text-anchor="middle" font-weight="600">tags["Current_Floor"]</text>
  <text class="sub" x="115" y="192" text-anchor="middle">a runtime_input --</text>
  <text class="sub" x="115" y="205" text-anchor="middle">plant-owned, not logic-owned</text>

  <text x="410" y="248" text-anchor="middle" class="sub">
    Both read/write the same shared tags dict -- the plant is just another writer, exactly like a real sensor would be.
  </text>
</svg>
