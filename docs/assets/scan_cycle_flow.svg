<svg viewBox="0 0 920 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <style>
    .box { fill: #f4f6f8; stroke: #333; stroke-width: 1.5; rx: 8; }
    .box-accent { fill: #eef2ff; stroke: #33449a; stroke-width: 1.5; rx: 8; }
    .title { font-size: 15px; font-weight: 600; fill: #111; }
    .sub { font-size: 11.5px; fill: #444; }
    .step-label { font-size: 12px; fill: #555; font-style: italic; }
    .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  </style>

  <!-- 1. Plain English -->
  <rect class="box" x="30" y="30" width="220" height="70"/>
  <text class="title" x="140" y="58" text-anchor="middle">Plain-English description</text>
  <text class="sub" x="140" y="78" text-anchor="middle">"the doors open once the car arrives,</text>
  <text class="sub" x="140" y="92" text-anchor="middle">and stay open for 6 seconds"</text>

  <!-- arrow 1 -->
  <path class="arrow" d="M 250 65 L 320 65"/>
  <text class="step-label" x="285" y="55" text-anchor="middle">translate</text>

  <!-- 2. YAML file -->
  <rect class="box-accent" x="330" y="20" width="240" height="90"/>
  <text class="title" x="450" y="45" text-anchor="middle">YAML file</text>
  <text class="sub" x="450" y="63" text-anchor="middle">tags (inputs / config / outputs)</text>
  <text class="sub" x="450" y="79" text-anchor="middle">+ operations (the logic graph)</text>
  <text class="sub" x="450" y="95" text-anchor="middle">written in any order</text>

  <!-- arrow 2 down -->
  <path class="arrow" d="M 450 110 L 450 155"/>
  <text class="step-label" x="530" y="135">topological_sort</text>

  <!-- 3. ordered operations -->
  <rect class="box" x="330" y="165" width="240" height="60"/>
  <text class="title" x="450" y="190" text-anchor="middle">Ordered operations list</text>
  <text class="sub" x="450" y="208" text-anchor="middle">a valid execution order, computed once</text>

  <!-- arrow 3 down -->
  <path class="arrow" d="M 450 225 L 450 270"/>

  <!-- 4. scan cycle loop -->
  <rect class="box-accent" x="270" y="280" width="490" height="225"/>
  <text class="title" x="515" y="305" text-anchor="middle">run_scan (repeats every scan)</text>
  <text class="sub" x="515" y="323" text-anchor="middle">each operation both reads and writes the shared tags dict,</text>
  <text class="sub" x="515" y="339" text-anchor="middle">evaluated strictly in this order, once per scan</text>

  <!-- op sequence, left to right, one call per operation -->
  <rect class="box" x="300" y="355" width="70" height="50"/>
  <text class="sub" x="335" y="385" text-anchor="middle">op 1</text>
  <path class="arrow" d="M 370 380 L 390 380"/>

  <rect class="box" x="390" y="355" width="70" height="50"/>
  <text class="sub" x="425" y="385" text-anchor="middle">op 2</text>
  <path class="arrow" d="M 460 380 L 480 380"/>

  <rect class="box" x="480" y="355" width="70" height="50"/>
  <text class="sub" x="515" y="385" text-anchor="middle">op 3</text>
  <path class="arrow" d="M 550 380 L 570 380"/>

  <text class="sub" x="583" y="385" text-anchor="middle" font-size="16">...</text>
  <path class="arrow" d="M 596 380 L 610 380"/>

  <rect class="box" x="610" y="355" width="90" height="50"/>
  <text class="sub" x="655" y="385" text-anchor="middle">op N</text>

  <!-- return path: results accumulate in tags, right-angle only, no diagonal -->
  <path class="arrow" d="M 655 405 L 655 460 L 130 460 L 130 440"/>

  <!-- shared tags dict -->
  <rect x="30" y="350" width="200" height="90" fill="none" stroke="#999" stroke-dasharray="4 3" rx="6"/>
  <text class="sub" x="130" y="372" text-anchor="middle" font-weight="600">shared "tags" dict</text>
  <text class="sub" x="130" y="390" text-anchor="middle">every op reads AND writes</text>
  <text class="sub" x="130" y="406" text-anchor="middle">here -- the only state</text>
  <text class="sub" x="130" y="422" text-anchor="middle">that persists between scans</text>

  <!-- horizontal arrow, tags into first op, straight -->
  <path class="arrow" d="M 230 380 L 300 380"/>

  <text class="step-label" x="392" y="483" text-anchor="middle">next scan starts here -- reads exactly what this scan just wrote into tags</text>
</svg>
