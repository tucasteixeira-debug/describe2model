<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .node { fill: #eef2ff; stroke: #33449a; stroke-width: 1.4; rx: 8; }
    .lbl { font-size: 13px; fill: #222; }
    .badge { fill: #33449a; }
    .badgetxt { fill: #fff; font-size: 12px; font-weight: 700; }
    .edge { stroke: #666; stroke-width: 1.4; fill: none; marker-end: url(#ta); }
  </style>

  <text x="450" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Real dependency graph, five of Elevator_System_1's operations</text>

  <!-- Clock_Pulse (1) -->
  <rect class="node" x="30" y="40" width="150" height="48"/>
  <circle class="badge" cx="42" cy="52" r="11"/>
  <text class="badgetxt" x="42" y="56" text-anchor="middle">1</text>
  <text class="lbl" x="105" y="69" text-anchor="middle">Clock_Pulse</text>

  <!-- Just_Arrived (2) -->
  <rect class="node" x="30" y="180" width="150" height="48"/>
  <circle class="badge" cx="42" cy="192" r="11"/>
  <text class="badgetxt" x="42" y="196" text-anchor="middle">2</text>
  <text class="lbl" x="105" y="209" text-anchor="middle">Just_Arrived</text>

  <!-- Door_Elapsed (3) -->
  <rect class="node" x="280" y="110" width="150" height="48"/>
  <circle class="badge" cx="292" cy="122" r="11"/>
  <text class="badgetxt" x="292" y="126" text-anchor="middle">3</text>
  <text class="lbl" x="355" y="139" text-anchor="middle">Door_Elapsed</text>

  <!-- Door_Timer_Q (4) -->
  <rect class="node" x="530" y="110" width="150" height="48"/>
  <circle class="badge" cx="542" cy="122" r="11"/>
  <text class="badgetxt" x="542" y="126" text-anchor="middle">4</text>
  <text class="lbl" x="605" y="139" text-anchor="middle">Door_Timer_Q</text>

  <!-- Doors_Open (5) -->
  <rect class="node" x="720" y="180" width="150" height="48"/>
  <circle class="badge" cx="732" cy="192" r="11"/>
  <text class="badgetxt" x="732" y="196" text-anchor="middle">5</text>
  <text class="lbl" x="795" y="209" text-anchor="middle">Doors_Open</text>

  <!-- edges: producer -> consumer -->
  <path class="edge" d="M 180 68 L 280 128"/>
  <path class="edge" d="M 180 198 L 280 145"/>
  <path class="edge" d="M 430 134 L 530 134"/>
  <path class="edge" d="M 680 145 L 720 190"/>
  <path class="edge" d="M 180 210 C 400 270, 550 270, 720 205"/>

  <text x="450" y="300" text-anchor="middle" font-size="12.5" fill="#444" font-style="italic">
    One valid order, out of possibly several: every arrow points from a lower number to a higher one.
  </text>
</svg>
