# Elevator System 2: control logic coupled to an external kinematic plant.
# The controller commands motion; the plant owns position and velocity.

runtime_inputs:
  Call_Floor0: {type: BOOL}
  Call_Floor1: {type: BOOL}
  Call_Floor2: {type: BOOL}
  Call_Floor3: {type: BOOL}
  Call_Floor4: {type: BOOL}
  Call_Floor5: {type: BOOL}
  Door_Obstruction: {type: BOOL}
  Close_Door_Button: {type: BOOL, note: "Momentary input: set True for one scan per press."}
  Current_Floor: {type: REAL, note: "Written every scan by the physics plant."}
  Velocity_FloorsPerSec: {type: REAL, note: "Plant-owned velocity, exposed for observability."}

hmi_configuration:
  Door_Hold_Time: {type: REAL, default: 6}
  Never: {type: BOOL, default: false}
  One_Second: {type: REAL, default: 1}

physical_constants:
  Top_Floor: {type: REAL, value: 5}
  Max_Velocity: {type: REAL, value: 0.5, note: "floors/second"}
  Acceleration: {type: REAL, value: 0.25, note: "floors/second^2"}
  Deceleration: {type: REAL, value: 0.25, note: "floors/second^2"}
  Arrival_Tolerance: {type: REAL, value: 0.02, note: "Position tolerance in floors."}
  Velocity_Snap_Tolerance: {type: REAL, value: 0.01, note: "Stop tolerance in floors/second."}

outputs:
  Target_Floor: {type: REAL}
  Any_Pending: {type: BOOL}
  Any_Call_Above: {type: BOOL}
  Any_Call_Below: {type: BOOL}
  Going_Up: {type: BOOL}
  Call_At_Current_Floor: {type: BOOL}
  Just_Arrived_Level: {type: BOOL}
  Just_Arrived: {type: BOOL}
  Clock_Pulse: {type: BOOL}
  Door_Elapsed: {type: REAL}
  Door_Timer_Q: {type: BOOL}
  Doors_Open: {type: BOOL}
  Moving: {type: BOOL, note: "Run/hold command read by the physics plant."}
  Floor0_Request: {type: BOOL}
  Floor1_Request: {type: BOOL}
  Floor2_Request: {type: BOOL}
  Floor3_Request: {type: BOOL}
  Floor4_Request: {type: BOOL}
  Floor5_Request: {type: BOOL}

operations:
  # --- Dispatch ---

  - name: "Any_Call_Above"
    type: "or"
    expression:
      or:
        - {and: [{var: "Call_Floor1"}, {gt: [1, {var: "Current_Floor"}]}]}
        - {and: [{var: "Call_Floor2"}, {gt: [2, {var: "Current_Floor"}]}]}
        - {and: [{var: "Call_Floor3"}, {gt: [3, {var: "Current_Floor"}]}]}
        - {and: [{var: "Call_Floor4"}, {gt: [4, {var: "Current_Floor"}]}]}
        - {and: [{var: "Call_Floor5"}, {gt: [5, {var: "Current_Floor"}]}]}
    output: "Any_Call_Above"

  - name: "Any_Call_Below"
    type: "or"
    expression:
      or:
        - {and: [{var: "Call_Floor0"}, {lt: [0, {var: "Current_Floor"}]}]}
        - {and: [{var: "Call_Floor1"}, {lt: [1, {var: "Current_Floor"}]}]}
        - {and: [{var: "Call_Floor2"}, {lt: [2, {var: "Current_Floor"}]}]}
        - {and: [{var: "Call_Floor3"}, {lt: [3, {var: "Current_Floor"}]}]}
        - {and: [{var: "Call_Floor4"}, {lt: [4, {var: "Current_Floor"}]}]}
    output: "Any_Call_Below"

  - name: "Going_Up"
    type: "RS"
    note: "LOOK direction state: continue in the current direction until no calls remain ahead."
    Set: [{and: [{"!": {var: "Any_Call_Below"}}, {var: "Any_Call_Above"}]}]
    Reset: [{and: [{"!": {var: "Any_Call_Above"}}, {var: "Any_Call_Below"}]}]
    output: "Going_Up"

  - name: "Target_Floor"
    type: "if"
    note: "Selects the nearest pending call in the current LOOK direction."
    expression:
      if:
        - {var: "Going_Up"}
        - if:
            - {and: [{var: "Call_Floor1"}, {gt: [1, {var: "Current_Floor"}]}]}
            - 1
            - if:
                - {and: [{var: "Call_Floor2"}, {gt: [2, {var: "Current_Floor"}]}]}
                - 2
                - if:
                    - {and: [{var: "Call_Floor3"}, {gt: [3, {var: "Current_Floor"}]}]}
                    - 3
                    - if:
                        - {and: [{var: "Call_Floor4"}, {gt: [4, {var: "Current_Floor"}]}]}
                        - 4
                        - if:
                            - {and: [{var: "Call_Floor5"}, {gt: [5, {var: "Current_Floor"}]}]}
                            - 5
                            - {var: "Current_Floor"}
        - if:
            - {and: [{var: "Call_Floor0"}, {lt: [0, {var: "Current_Floor"}]}]}
            - 0
            - if:
                - {and: [{var: "Call_Floor1"}, {lt: [1, {var: "Current_Floor"}]}]}
                - 1
                - if:
                    - {and: [{var: "Call_Floor2"}, {lt: [2, {var: "Current_Floor"}]}]}
                    - 2
                    - if:
                        - {and: [{var: "Call_Floor3"}, {lt: [3, {var: "Current_Floor"}]}]}
                        - 3
                        - if:
                            - {and: [{var: "Call_Floor4"}, {lt: [4, {var: "Current_Floor"}]}]}
                            - 4
                            - {var: "Current_Floor"}
    output: "Target_Floor"

  - name: "Any_Pending"
    type: "or"
    expression:
      or:
        - {var: "Call_Floor0"}
        - {var: "Call_Floor1"}
        - {var: "Call_Floor2"}
        - {var: "Call_Floor3"}
        - {var: "Call_Floor4"}
        - {var: "Call_Floor5"}
    output: "Any_Pending"

  # --- Movement ---

  - name: "Moving"
    type: "and"
    expression:
      and:
        - {"!": {var: "Doors_Open"}}
        - {"!": {eq: [{var: "Target_Floor"}, {var: "Current_Floor"}]}}
    output: "Moving"

  # --- Doors ---

  - name: "Doors_Open"
    type: "RS"
    note: "Doors close after the hold timer or immediately on a manual close command."
    Set: [{var: "Just_Arrived"}]
    Reset: [{var: "Door_Timer_Q"}, {var: "Close_Door_Button"}]
    output: "Doors_Open"

  - name: "Just_Arrived"
    type: "R_TRIG"
    IN: {var: "Just_Arrived_Level"}
    output: "Just_Arrived"

  - name: "Call_At_Current_Floor"
    type: "or"
    note: "Arrival is detected from a pending call at the observed position, independent of Target_Floor changing during the same scan."
    expression:
      or:
        - {and: [{var: "Call_Floor0"}, {eq: [0, {var: "Current_Floor"}]}]}
        - {and: [{var: "Call_Floor1"}, {eq: [1, {var: "Current_Floor"}]}]}
        - {and: [{var: "Call_Floor2"}, {eq: [2, {var: "Current_Floor"}]}]}
        - {and: [{var: "Call_Floor3"}, {eq: [3, {var: "Current_Floor"}]}]}
        - {and: [{var: "Call_Floor4"}, {eq: [4, {var: "Current_Floor"}]}]}
        - {and: [{var: "Call_Floor5"}, {eq: [5, {var: "Current_Floor"}]}]}
    output: "Call_At_Current_Floor"

  - name: "Just_Arrived_Condition"
    type: "and"
    expression:
      and:
        - {var: "Call_At_Current_Floor"}
    output: "Just_Arrived_Level"

  - name: "Door_Timer_Q"
    type: "ge"
    expression:
      ge: [{var: "Door_Elapsed"}, {var: "Door_Hold_Time"}]
    output: "Door_Timer_Q"

  - name: "Door_Elapsed"
    type: "CTUD"
    note: "Door timing resets on arrival or obstruction."
    CU: {var: "Clock_Pulse"}
    CD: {var: "Never"}
    R:
      or:
        - {var: "Just_Arrived"}
        - {var: "Door_Obstruction"}
    LD: {var: "Never"}
    load_value: 0
    PV: {var: "Door_Hold_Time"}
    output: "Door_Elapsed"

  - name: "Clock_Pulse"
    type: "TON"
    note: "Self-oscillating timer used as the door-timing clock."
    IN: {"!": {var: "Clock_Pulse"}}
    PT: {var: "One_Second"}
    output: "Clock_Pulse"

  # --- Request state ---

  - name: "Floor0_Request"
    type: "RS"
    Set: [{var: "Call_Floor0"}]
    Reset: [{and: [{var: "Doors_Open"}, {eq: [{var: "Current_Floor"}, 0]}]}]
    output: "Floor0_Request"

  - name: "Floor1_Request"
    type: "RS"
    Set: [{var: "Call_Floor1"}]
    Reset: [{and: [{var: "Doors_Open"}, {eq: [{var: "Current_Floor"}, 1]}]}]
    output: "Floor1_Request"

  - name: "Floor2_Request"
    type: "RS"
    Set: [{var: "Call_Floor2"}]
    Reset: [{and: [{var: "Doors_Open"}, {eq: [{var: "Current_Floor"}, 2]}]}]
    output: "Floor2_Request"

  - name: "Floor3_Request"
    type: "RS"
    Set: [{var: "Call_Floor3"}]
    Reset: [{and: [{var: "Doors_Open"}, {eq: [{var: "Current_Floor"}, 3]}]}]
    output: "Floor3_Request"

  - name: "Floor4_Request"
    type: "RS"
    Set: [{var: "Call_Floor4"}]
    Reset: [{and: [{var: "Doors_Open"}, {eq: [{var: "Current_Floor"}, 4]}]}]
    output: "Floor4_Request"

  - name: "Floor5_Request"
    type: "RS"
    Set: [{var: "Call_Floor5"}]
    Reset: [{and: [{var: "Doors_Open"}, {eq: [{var: "Current_Floor"}, 5]}]}]
    output: "Floor5_Request"