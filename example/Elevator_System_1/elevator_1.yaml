# Elevator System 1: control logic only.
# Position is generated internally by the rule graph; there is no physical plant.

runtime_inputs:
  Call_Floor0: {type: BOOL}
  Call_Floor1: {type: BOOL}
  Call_Floor2: {type: BOOL}
  Call_Floor3: {type: BOOL}
  Call_Floor4: {type: BOOL}
  Call_Floor5: {type: BOOL}
  Door_Obstruction: {type: BOOL}
  Close_Door_Button: {type: BOOL, note: "Momentary input: set True for one scan per press."}

hmi_configuration:
  Travel_Time_Per_Floor: {type: REAL, default: 4}
  Door_Hold_Time: {type: REAL, default: 6}
  Top_Floor: {type: REAL, default: 5}
  Never: {type: BOOL, default: false}
  One_Second: {type: REAL, default: 1}

outputs:
  Target_Floor: {type: REAL}
  Any_Pending: {type: BOOL}
  Travel_Pulse: {type: BOOL}
  Current_Floor: {type: REAL}
  Just_Arrived_Level: {type: BOOL}
  Just_Arrived: {type: BOOL}
  Clock_Pulse: {type: BOOL}
  Door_Elapsed: {type: REAL}
  Door_Timer_Q: {type: BOOL}
  Doors_Open: {type: BOOL}
  Moving: {type: BOOL}
  Floor0_Request: {type: BOOL}
  Floor1_Request: {type: BOOL}
  Floor2_Request: {type: BOOL}
  Floor3_Request: {type: BOOL}
  Floor4_Request: {type: BOOL}
  Floor5_Request: {type: BOOL}

operations:
  # --- Dispatch ---

  - name: "Target_Floor"
    type: "if"
    note: "Simple priority dispatch: lowest-numbered active call is selected first."
    expression:
      if:
        - {var: "Call_Floor0"}
        - 0
        - if:
            - {var: "Call_Floor1"}
            - 1
            - if:
                - {var: "Call_Floor2"}
                - 2
                - if:
                    - {var: "Call_Floor3"}
                    - 3
                    - if:
                        - {var: "Call_Floor4"}
                        - 4
                        - if:
                            - {var: "Call_Floor5"}
                            - 5
                            - 0
    output: "Target_Floor"

  - name: "Any_Pending"
    type: "or"
    expression:
      or:
        - {var: "Call_Floor0"}
        - {var: "Call_Floor1"}
        - {var: "Call_Floor2"}
        - {var: "Call_Floor3"}
        - {var: "Call_Floor4"}
        - {var: "Call_Floor5"}
    output: "Any_Pending"

  # --- Movement ---

  - name: "Current_Floor"
    type: "CTUD"
    note: "Self-reference reads the previous scan's Current_Floor value."
    CU:
      and:
        - {var: "Travel_Pulse"}
        - gt: [{var: "Target_Floor"}, {var: "Current_Floor"}]
    CD:
      and:
        - {var: "Travel_Pulse"}
        - lt: [{var: "Target_Floor"}, {var: "Current_Floor"}]
    R: {var: "Never"}
    LD: {var: "Never"}
    load_value: 0
    PV: {var: "Top_Floor"}
    output: "Current_Floor"

  - name: "Moving"
    type: "and"
    expression:
      and:
        - {"!": {var: "Doors_Open"}}
        - {"!": {eq: [{var: "Target_Floor"}, {var: "Current_Floor"}]}}
    output: "Moving"

  - name: "Travel_Pulse"
    type: "TON"
    note: "Self-oscillating timer used to represent discrete floor crossings."
    IN:
      and:
        - {var: "Any_Pending"}
        - {"!": {var: "Travel_Pulse"}}
    PT: {var: "Travel_Time_Per_Floor"}
    output: "Travel_Pulse"

  # --- Doors ---

  - name: "Doors_Open"
    type: "RS"
    note: "Doors close after the hold timer or immediately on a manual close command."
    Set: [{var: "Just_Arrived"}]
    Reset: [{var: "Door_Timer_Q"}, {var: "Close_Door_Button"}]
    output: "Doors_Open"

  - name: "Just_Arrived"
    type: "R_TRIG"
    IN: {var: "Just_Arrived_Level"}
    output: "Just_Arrived"

  - name: "Just_Arrived_Condition"
    type: "and"
    note: "Any_Pending prevents a false arrival event at startup."
    expression:
      and:
        - {var: "Any_Pending"}
        - eq: [{var: "Current_Floor"}, {var: "Target_Floor"}]
    output: "Just_Arrived_Level"

  - name: "Door_Timer_Q"
    type: "ge"
    expression:
      ge: [{var: "Door_Elapsed"}, {var: "Door_Hold_Time"}]
    output: "Door_Timer_Q"

  - name: "Door_Elapsed"
    type: "CTUD"
    note: "Door timing resets on arrival or obstruction."
    CU: {var: "Clock_Pulse"}
    CD: {var: "Never"}
    R:
      or:
        - {var: "Just_Arrived"}
        - {var: "Door_Obstruction"}
    LD: {var: "Never"}
    load_value: 0
    PV: {var: "Door_Hold_Time"}
    output: "Door_Elapsed"

  - name: "Clock_Pulse"
    type: "TON"
    note: "Self-oscillating timer used as the door-timing clock."
    IN: {"!": {var: "Clock_Pulse"}}
    PT: {var: "One_Second"}
    output: "Clock_Pulse"

  # --- Request state ---

  - name: "Floor0_Request"
    type: "RS"
    Set: [{var: "Call_Floor0"}]
    Reset: [{and: [{var: "Doors_Open"}, {eq: [{var: "Current_Floor"}, 0]}]}]
    output: "Floor0_Request"

  - name: "Floor1_Request"
    type: "RS"
    Set: [{var: "Call_Floor1"}]
    Reset: [{and: [{var: "Doors_Open"}, {eq: [{var: "Current_Floor"}, 1]}]}]
    output: "Floor1_Request"

  - name: "Floor2_Request"
    type: "RS"
    Set: [{var: "Call_Floor2"}]
    Reset: [{and: [{var: "Doors_Open"}, {eq: [{var: "Current_Floor"}, 2]}]}]
    output: "Floor2_Request"

  - name: "Floor3_Request"
    type: "RS"
    Set: [{var: "Call_Floor3"}]
    Reset: [{and: [{var: "Doors_Open"}, {eq: [{var: "Current_Floor"}, 3]}]}]
    output: "Floor3_Request"

  - name: "Floor4_Request"
    type: "RS"
    Set: [{var: "Call_Floor4"}]
    Reset: [{and: [{var: "Doors_Open"}, {eq: [{var: "Current_Floor"}, 4]}]}]
    output: "Floor4_Request"

  - name: "Floor5_Request"
    type: "RS"
    Set: [{var: "Call_Floor5"}]
    Reset: [{and: [{var: "Doors_Open"}, {eq: [{var: "Current_Floor"}, 5]}]}]
    output: "Floor5_Request"